<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="FACEIT Autopilot — Auto-accept FACEIT matches and auto-ban maps by your priority list">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161618" />
      <stop offset="100%" stop-color="#1e1e21" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ff5500" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bg)" stroke="#2a2a2e" stroke-width="2" />
  <rect x="1" y="1" width="460" height="218" rx="14" fill="url(#accentGlow)" />

  <!-- Left accent bar (matches in-page toast border) -->
  <rect x="2" y="24" width="5" height="172" rx="2.5" fill="#ff5500" />

  <!-- Subtle right-side geometric accents -->
  <g opacity="0.16" stroke="#ff5500" stroke-width="1.5" fill="none">
    <line x1="680" y1="0" x2="820" y2="220" />
    <line x1="720" y1="0" x2="860" y2="220" />
    <line x1="760" y1="0" x2="900" y2="220" />
  </g>

  <!-- Title & tagline -->
  <text x="48" y="84" fill="#ff5500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">FACEIT Autopilot</text>
  <text x="48" y="120" fill="#eeeeee" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400">Auto-accept FACEIT matches and auto-ban maps by your priority list.</text>

  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500">
    <rect x="48" y="148" width="136" height="32" rx="6" fill="#1e1e21" stroke="#3a3a3f" />
    <circle cx="66" cy="164" r="4" fill="#ff5500" />
    <text x="79" y="169" fill="#eeeeee">Auto-Accept</text>

    <rect x="196" y="148" width="158" height="32" rx="6" fill="#1e1e21" stroke="#3a3a3f" />
    <circle cx="214" cy="164" r="4" fill="#ff5500" />
    <text x="227" y="169" fill="#eeeeee">Priority Map Ban</text>

    <rect x="366" y="148" width="174" height="32" rx="6" fill="#1e1e21" stroke="#3a3a3f" />
    <circle cx="384" cy="164" r="4" fill="#ff5500" />
    <text x="397" y="169" fill="#eeeeee">Custom Match Audio</text>

    <rect x="552" y="148" width="166" height="32" rx="6" fill="#1e1e21" stroke="#3a3a3f" />
    <circle cx="570" cy="164" r="4" fill="#ff5500" />
    <text x="583" y="169" fill="#eeeeee">Cancelable Toast</text>
  </g>
</svg>
